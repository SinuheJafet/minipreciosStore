<header class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar__container">
    <!-- Logo -->
    <a routerLink="/" class="navbar__logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">mini<strong>precios</strong></span>
    </a>

    <!-- Nav Links -->
    <nav class="navbar__nav" [class.open]="mobileMenuOpen">
      <a *ngFor="let link of navLinks" [routerLink]="link.path"
         [queryParams]="link.queryParams" routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: link.path === '/'}"
         (click)="mobileMenuOpen = false">
        {{ link.label }}
      </a>
    </nav>

    <!-- Search -->
    <div class="navbar__search" [class.expanded]="showSearch">
      <div class="search-input-wrap" *ngIf="showSearch">
        <input type="text" placeholder="Buscar productos..." [(ngModel)]="searchQuery"
               (input)="onSearch(searchQuery)" (keyup.enter)="submitSearch()" autofocus>
        <button class="btn-icon" (click)="submitSearch()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <div class="search-dropdown" *ngIf="searchResults.length > 0">
          <div class="search-item" *ngFor="let p of searchResults" (click)="goToProduct(p.id)">
            <img [src]="p.images[0]" [alt]="p.name">
            <div>
              <span class="name">{{ p.name }}</span>
              <span class="price">{{ p.price | currency:'EUR':'symbol':'1.0-0' }}</span>
            </div>
          </div>
        </div>
      </div>
      <button class="btn-icon" (click)="showSearch = !showSearch">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>

    <!-- Actions -->
    <div class="navbar__actions">
      <!-- Wishlist -->
      <a routerLink="/wishlist" class="btn-icon badge-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="badge" *ngIf="wishlistCount > 0">{{ wishlistCount }}</span>
      </a>
      <!-- Cart -->
      <a routerLink="/cart" class="btn-icon badge-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <!-- User: not logged in -->
      <a *ngIf="!currentUser" routerLink="/auth" class="btn-login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Entrar
      </a>

      <!-- User: logged in -->
      <div class="user-menu" *ngIf="currentUser">
        <button class="user-btn" (click)="userDropdown = !userDropdown">
          <div class="user-avatar">{{ firstName[0] }}</div>
          <span class="user-name">{{ firstName }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="user-dropdown" [class.open]="userDropdown">
          <div class="user-dropdown__header">
            <span class="ud-name">{{ currentUser.name }}</span>
            <span class="ud-email">{{ currentUser.email }}</span>
          </div>
          <a *ngIf="isAdmin" routerLink="/admin" class="ud-item" (click)="userDropdown = false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Panel de administración
          </a>
          <button class="ud-item ud-item--danger" (click)="logout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Cerrar sesión
          </button>
        </div>
      </div>

      <!-- Mobile menu toggle -->
      <button class="btn-icon mobile-menu-btn" (click)="mobileMenuOpen = !mobileMenuOpen">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line *ngIf="!mobileMenuOpen" x1="3" y1="6" x2="21" y2="6"/><line *ngIf="!mobileMenuOpen" x1="3" y1="12" x2="21" y2="12"/><line *ngIf="!mobileMenuOpen" x1="3" y1="18" x2="21" y2="18"/>
          <line *ngIf="mobileMenuOpen" x1="18" y1="6" x2="6" y2="18"/><line *ngIf="mobileMenuOpen" x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="admin">

  <!-- ── Top Bar ─────────────────────────────────────────────────── -->
  <header class="admin-topbar">
    <div class="admin-topbar__left">
      <button class="sidebar-toggle" (click)="sidebarOpen = !sidebarOpen" title="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <a routerLink="/" class="admin-logo">
        <span>⚡</span><span>mini<strong>precios</strong></span>
        <span class="admin-badge">POS</span>
      </a>
    </div>
    <div class="admin-topbar__right">
      <a routerLink="/" class="topbar-link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Ver tienda
      </a>
      <div class="topbar-user">
        <div class="topbar-avatar">{{ adminName[0] }}</div>
        {{ adminName }}
      </div>
      <button class="btn-logout" (click)="logout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Salir
      </button>
    </div>
  </header>

  <div class="admin-body" [class.expanded]="!sidebarOpen">

    <!-- ── Sidebar ────────────────────────────────────────────────── -->
    <aside class="admin-sidebar" [class.open]="sidebarOpen" [class.closed]="!sidebarOpen">
      <nav class="sidebar-nav">

        <button class="sidebar-nav__item" [class.active]="activeSection==='dashboard'" (click)="navigate('dashboard')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </button>

        <div class="sidebar-divider"></div>

        <button class="sidebar-nav__item sidebar-nav__item--pos" [class.active]="activeSection==='pos'" (click)="navigate('pos')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span>Nueva Venta</span>
        </button>

        <div class="sidebar-divider"></div>

        <button class="sidebar-nav__item" [class.active]="activeSection==='orders'" (click)="navigate('orders')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span>Pedidos</span>
          <span class="sidebar-badge" *ngIf="pendingOrdersCount > 0">{{ pendingOrdersCount }}</span>
        </button>

        <button class="sidebar-nav__item" [class.active]="activeSection==='products'" (click)="navigate('products')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
          <span>Productos</span>
        </button>

        <button class="sidebar-nav__item" [class.active]="activeSection==='inventory'" (click)="navigate('inventory')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
          <span>Inventario</span>
          <span class="sidebar-badge sidebar-badge--warn" *ngIf="lowStockCount > 0">{{ lowStockCount }}</span>
        </button>

        <button class="sidebar-nav__item" [class.active]="activeSection==='movements'" (click)="navigate('movements')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
          <span>Movimientos</span>
        </button>

        <div class="sidebar-divider"></div>

        <button class="sidebar-nav__item" [class.active]="activeSection==='users'" (click)="navigate('users')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Usuarios y Roles</span>
        </button>

        <button class="sidebar-nav__item" [class.active]="activeSection==='customers'" (click)="navigate('customers')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Clientes</span>
        </button>

        <div class="sidebar-divider"></div>

        <button class="sidebar-nav__item" [class.active]="activeSection==='banners'" (click)="navigate('banners')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="5" rx="1"/><rect x="3" y="10" width="18" height="5" rx="1"/><rect x="3" y="17" width="18" height="4" rx="1"/></svg>
          <span>Publicidad</span>
        </button>

        <button class="sidebar-nav__item" [class.active]="activeSection==='payment-accounts'" (click)="navigate('payment-accounts')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="10" y2="15"/></svg>
          <span>Cuentas bancarias</span>
        </button>

      </nav>
    </aside>

    <!-- ── Main content ──────────────────────────────────────────── -->
    <main class="admin-content">

      <admin-dashboard-section  *ngIf="activeSection==='dashboard'"></admin-dashboard-section>
      <admin-pos-section        *ngIf="activeSection==='pos'"></admin-pos-section>
      <admin-orders-section     *ngIf="activeSection==='orders'"></admin-orders-section>
      <admin-products-section   *ngIf="activeSection==='products'"></admin-products-section>
      <admin-inventory-section  *ngIf="activeSection==='inventory'"></admin-inventory-section>
      <admin-movements-section  *ngIf="activeSection==='movements'"></admin-movements-section>
      <admin-users-section      *ngIf="activeSection==='users'"></admin-users-section>
      <admin-customers-section  *ngIf="activeSection==='customers'"></admin-customers-section>
      <admin-banners-section    *ngIf="activeSection==='banners'"></admin-banners-section>
      <admin-payment-accounts-section *ngIf="activeSection==='payment-accounts'"></admin-payment-accounts-section>

    </main>
  </div>
</div>
